; Shortcut BLE beacon firmware (PlatformIO, Arduino framework, C++)
;
; Build + flash + monitor (from this folder):
;   pio run -e esp32s3 -t upload -t monitor
;
; Every board runs the same source/protocol; each chip family gets its own target binary.
; Beacon id and calibration live in NVS and are set over BLE (from the iOS app) or
; USB serial. See README "Flash the ESP32 beacons".
;
; Platform: pioarduino (Arduino-ESP32 3.3.x / ESP-IDF 5.5). Pinned to an exact release
; so every teammate builds the same thing. Note: on ESP32-S3 the Arduino core uses the
; NimBLE stack, on the classic ESP32 it uses Bluedroid; the firmware supports both.

[platformio]
default_envs = esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; BLE stack + Arduino needs more than the default 1.25 MB app slot on some chips; OTA is not used.
board_build.partitions = huge_app.csv
; 4 MB works on 4/8/16 MB modules, so one setting covers every board we have.
board_upload.flash_size = 4MB
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=1
build_src_flags =
    -Wall
    -Wextra

; ESP32-S3 DevKitC-1 style boards using the native USB Serial/JTAG port.
; USB CDC is enabled so firmware logs and serial calibration use that cable.
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; Classic ESP32 dev board (ESP32-WROOM-32).
[env:esp32]
board = esp32dev

; ESP32-WROVER-E module (classic ESP32 + PSRAM). PSRAM is not needed for a beacon but
; enabling it is harmless and matches the hardware.
[env:esp32-wrover-e]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
